[mypy]
# Python Version
python_version = 3.11

# Import Discovery — Full active-module scope (Phase 0 expansion, 2026-07-28)
files = wellbeing_session_interface.py,agent_chatbot_logic.py,agent_toolkit.py,chatbot_logic.py,chat_context_manager.py,chat_image_generator.py,code_executor_engine.py,emotional_analyzer.py,enhanced_streamlit_bot.py,generic_visualization_tool.py,gpu_optimizer.py,kg_dashboard.py,llm_output_schemas.py,llm_structured_wrapper.py,models_pydantic_v2.py,pdf_readability_checker.py,structured_data_extractor.py,agent/,wellbeing/,wellbeing_session/,finance/,web_search/,ui_tabs/,database/,utils/,i18n/,llm_utils/,pii_protection/,user_context_builder/,content_extractor/,html_parser/,schemas/
ignore_missing_imports = True
exclude = ^(dead_code_archive|build|dist|\.git|backups|venv_mistral_vibe|venv_mistral_gguf|tests|\.mypy_cache|__pycache__|archive)/|^model_loader\.py$

# Type Checking Strictness (Start Medium, will increase gradually)
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = False
warn_no_return = True
warn_unreachable = False
check_untyped_defs = False

# Disallow untyped definitions (Start False, will enable per module)
disallow_untyped_defs = False
disallow_any_unimported = False
disallow_any_expr = False
disallow_any_decorated = False
disallow_any_explicit = False
disallow_any_generics = False
disallow_subclassing_any = False

# Per-module options (Strict for new modules from Phase 6)
[mypy-wellbeing_session.*]
disallow_untyped_defs = True
check_untyped_defs = True
warn_unused_ignores = True

[mypy-user_context_builder.*]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-psycho_chat.*]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-html_parser.*]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-content_extractor.*]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-web_search.*]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-wellbeing.*]
disallow_untyped_defs = True
check_untyped_defs = True
warn_unused_ignores = True

[mypy-emotional_analyzer]
disallow_untyped_defs = True
check_untyped_defs = True
warn_unused_ignores = True

[mypy-agent.contradiction_detector]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-agent.extraction_cache]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-agent.generic_intent_classifier]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-agent.rag_store.utils.resource_manager]
disallow_untyped_defs = True
check_untyped_defs = True

# External dependencies
[mypy-streamlit.*]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-fakeredis.*]
ignore_missing_imports = True

[mypy-redis.*]
ignore_missing_imports = True

[mypy-trafilatura.*]
ignore_missing_imports = True

[mypy-readability.*]
ignore_missing_imports = True

[mypy-newspaper.*]
ignore_missing_imports = True